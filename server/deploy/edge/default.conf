# edge: Cloudflare에서 온 요청만 받아 동기화 서버로 넘긴다.
# - Cloudflare 대역이 아니면 403(원본 IP로 직접 와서 Cloudflare를 우회하는 것 차단).
# - 실제 클라이언트 IP는 CF-Connecting-IP에서 가져와 X-Forwarded-For 하나로 덮어쓴다(서버 요청 제한용).
# - /v1/, /healthz만 연다.
# Cloudflare 대역 출처: https://www.cloudflare.com/ips-v4, ips-v6 (2026-11-15 기준). 대역이 바뀌면 이 목록을 다시 만든다.

geo $realip_remote_addr $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

log_format edge '$time_iso8601 $remote_addr $status $request_method $uri $request_time';
limit_req_zone $binary_remote_addr zone=perip:5m rate=10r/s;

server {
    listen 8080 default_server;
    server_tokens off;
    client_max_body_size 16k;
    access_log /dev/stdout edge;
    error_log /dev/stderr warn;

    if ($from_cloudflare = 0) { return 403; }

    location /v1/ {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://app:8080;
    }

    location / {
        return 404;
    }
}
